<style>
body{overflow:auto;background:var(--srf-1)}main{max-width:1160px;padding:26px 32px;margin:auto}header{display:flex;align-items:center;gap:18px}h1{font-size:18px;font-weight:600;margin:0;color:var(--text-hi)}header>span{font-size:11px;color:var(--star-hi)}.intro{font-size:12px;color:var(--text-dim);margin:12px 0 24px;line-height:1.7}.layout{display:grid;grid-template-columns:400px minmax(0,1fr);gap:30px}.design-panel{background:var(--srf-2);border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;align-self:start;min-height:640px}.tab{display:flex;justify-content:space-between;align-items:center;height:32px;padding:0 12px;background:var(--srf-1)}.tab>svg{color:var(--text-faint)}.design-search{display:flex;align-items:center;gap:8px;height:26px;margin:6px 8px;padding:0 8px;background:var(--inset);border-radius:var(--r-sm);color:var(--text-faint)}.design-search input{background:none;border:0;outline:none;font:inherit;color:var(--text)}.design-panel>.insp{height:auto;overflow:visible}.ent-sub{padding:0 8px}.comp-head>svg{flex-shrink:0;color:var(--text-dim)}fieldset.comp-fields{border:0;min-inline-size:0;margin:0}.reflection-fields .prop-value>.sel-trigger{flex:1;width:100%;min-width:0}.group{margin:10px 0 4px;padding:7px 0 3px;border-top:1px solid var(--line-soft);font-size:var(--fs-detail);color:var(--text-faint)}.group:first-child{border:0;margin-top:0}.read-value{font-size:var(--fs-detail);color:var(--text-dim);padding-left:6px}.field-note{font-size:var(--fs-detail);color:var(--text-faint);line-height:1.7;margin:7px 0 10px}.diagnostics{margin-top:14px;border-top:1px solid var(--line-soft)}.diagnostics>summary{list-style:none;cursor:pointer;color:var(--text-dim);font-size:var(--fs-detail);padding:10px 0}.diagnostics>summary:before{content:'›';padding-right:8px}.diagnostics[open]>summary:before{content:'⌄'}.diagnostics summary::-webkit-details-marker{display:none}.transform>summary{list-style:none;cursor:pointer}.transform>summary::-webkit-details-marker{display:none}.disabled-reflection>.reflection-fields{opacity:.45}.reference-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.reference-head>span{font-size:11px;color:var(--text-faint)}aside{font-size:12px;line-height:1.8;color:var(--text-dim)}aside h2{font-size:14px;color:var(--text-hi);margin:0}aside h3{font-size:12px;font-weight:600;color:var(--text);margin:18px 0 4px}aside p{margin:0}figure{margin:0}figure img{width:100%;display:block;border:1px solid var(--line);border-radius:var(--r-sm)}figcaption{font-size:10px;color:var(--text-faint);margin-top:5px}.quality-preview{display:flex;gap:12px;align-items:center}.quality-preview>.sel-trigger{width:90px}.quality-preview>span{font-size:11px;color:var(--text-faint)}ol{padding-left:18px;margin:4px 0}.note{border-top:1px solid var(--line-soft);padding-top:12px;margin-top:17px!important;font-size:11px;color:var(--text-faint)}summary:focus-visible{outline:1px solid var(--star)}@media(max-width:800px){main{padding:18px 14px}.layout{grid-template-columns:minmax(0,1fr);gap:20px}header{flex-wrap:wrap;gap:8px}.quality-preview{flex-wrap:wrap}}
